name: Pre-Kickoff Lineup Check

on:
  schedule:
    # Lineup Protection is off and locks happen per-player at kickoff, not
    # one Sunday cutoff -- so this needs to run before each wave of games,
    # not just once. Times are UTC, computed for EDT (UTC-4); shift by an
    # hour once the season crosses into EST in November.
    #
    # Widened from 4 to 7 checks/week after finding two real gaps: London/
    # international games kick off ~9:30am ET, well before the old first
    # Sunday check (11:30am ET, timed for the standard 1pm slate) -- so an
    # early-international lock would've already passed unnoticed. And there
    # was no dedicated Sunday Night Football check at all between the late
    # afternoon slate and Monday.
    - cron: "0 22 * * 4"   # ~6pm ET Thursday -- before Thursday Night Football
    - cron: "0 22 * * 5"   # ~6pm ET Friday -- rare Friday/international games
    - cron: "0 11 * * 0"   # ~7am ET Sunday -- London/early-international kickoffs
    - cron: "30 15 * * 0"  # ~11:30am ET Sunday -- before the standard early slate
    - cron: "0 20 * * 0"   # ~4pm ET Sunday -- before the late afternoon slate
    - cron: "30 23 * * 0"  # ~7:30pm ET Sunday -- before Sunday Night Football
    - cron: "0 22 * * 1"   # ~6pm ET Monday -- before Monday Night Football
  workflow_dispatch:

jobs:
  run-lineup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Decide lineup
        working-directory: scripts
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python decide.py --lineup > /tmp/decision.json

      - name: Set lineup
        working-directory: scripts
        env:
          ESPN_STORAGE_STATE: ${{ secrets.ESPN_STORAGE_STATE }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          DRY_RUN: "false"  # verified live 2026-09-09 -- set_lineup() actually works
        run: |
          python - << 'PYEOF'
          import json, browser_actions
          d = json.load(open("/tmp/decision.json"))
          for swap in d["swaps"]:
              browser_actions.set_lineup(swap["start"], swap["sit"])
          PYEOF

      - name: Commit updated log
        run: |
          git config user.name "code-red-zone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/log.json
          git commit -m "Lineup check" || echo "Nothing to commit"
          git push
