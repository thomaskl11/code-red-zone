name: Waiver Decision

on:
  schedule:
    # ESPN's waiver period is a rolling per-drop countdown, not a fixed
    # weekly day -- it processes nightly, roughly 3-5am ET. Running at
    # 10am UTC (5-6am ET, covering both EDT and EST) stays safely clear of
    # that window.
    #
    # Cut from daily to 2x/week -- daily was rarely finding anything real
    # (see the season log), and the two moments that actually matter are
    # right after the Sunday/Monday injury fallout, and right before the
    # weekend once Wed/Thu practice reports firm up.
    - cron: "0 10 * * 2"   # Tuesday -- post-Sunday/MNF fallout
    - cron: "0 10 * * 5"   # Friday -- pre-weekend, Wed/Thu injury reports
  workflow_dispatch:        # adds a manual "Run workflow" button as a fallback

jobs:
  run-waivers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # ESPN's Undroppables list changes all season; protected_players.json is
      # refreshed from the live page before every decision. If the refresh
      # fails the previous copy stays in place, so it never blocks the check.
      - name: Refresh undroppables list
        working-directory: scripts
        continue-on-error: true
        timeout-minutes: 5
        run: python refresh_protected.py

      - name: Decide waiver move
        working-directory: scripts
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python decide.py > /tmp/decision.json

      - name: Execute waiver claim
        working-directory: scripts
        env:
          ESPN_STORAGE_STATE: ${{ secrets.ESPN_STORAGE_STATE }}
          # Only for the re-plan-without-IR fallback, which re-runs the decision.
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          DRY_RUN: "false"  # verified live 2026-09-22 -- submit_waiver_claim() and move_player_to_ir() confirmed working
        run: python execute_waiver.py

      - name: Log setup failure
        if: failure() && steps.install.outcome != 'success'
        working-directory: scripts
        run: |
          python - << 'PYEOF2'
          import log_store
          log_store.append_entry(
              kind="waiver",
              headline="CHECK COULD NOT RUN",
              reasoning=(
                  "Setup (installing dependencies) failed or timed out on "
                  "GitHub's side before this check could start. Nothing was "
                  "changed on ESPN. The next scheduled check will try again."
              ),
              meta={"execution_failed": True, "stage": "setup"},
          )
          PYEOF2

      # if: always() so a failed execution above still gets its "MOVE COULD
      # NOT BE MADE" entry published to the public dashboard, not just left
      # sitting invisibly in a red Actions run nobody but Claude checks.
      - name: Commit updated log
        if: always()
        run: |
          git config user.name "code-red-zone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/log.json scripts/protected_players.json
          git commit -m "Weekly waiver decision" || echo "Nothing to commit"
          git push
