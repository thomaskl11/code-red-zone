name: Waiver Decision

on:
  schedule:
    # ESPN's waiver period is a rolling per-drop countdown, not a fixed
    # weekly day -- it processes nightly, roughly 3-5am ET. Running at
    # 10am UTC (5-6am ET, covering both EDT and EST) stays safely clear of
    # that window.
    #
    # Cut from daily to 2x/week -- daily was rarely finding anything real
    # (see the season log), and the two moments that actually matter are
    # right after the Sunday/Monday injury fallout, and right before the
    # weekend once Wed/Thu practice reports firm up.
    - cron: "0 10 * * 2"   # Tuesday -- post-Sunday/MNF fallout
    - cron: "0 10 * * 5"   # Friday -- pre-weekend, Wed/Thu injury reports
  workflow_dispatch:        # adds a manual "Run workflow" button as a fallback

jobs:
  run-waivers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Decide waiver move
        working-directory: scripts
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python decide.py > /tmp/decision.json

      - name: Execute waiver claim
        working-directory: scripts
        env:
          ESPN_STORAGE_STATE: ${{ secrets.ESPN_STORAGE_STATE }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
          DRY_RUN: "false"  # verified live 2026-09-22 -- submit_waiver_claim() and move_player_to_ir() confirmed working
        run: |
          python - << 'PYEOF'
          import json, sys, browser_actions, log_store

          d = json.load(open("/tmp/decision.json"))
          had_failure = False
          ir_ok = True

          if d.get("ir_move"):
              try:
                  browser_actions.move_player_to_ir(d["ir_move"])
              except Exception as e:
                  had_failure = True
                  ir_ok = False
                  log_store.append_entry(
                      kind="waiver",
                      headline="MOVE COULD NOT BE MADE",
                      reasoning=(
                          f'Tried to move {d["ir_move"]} to IR to free a roster spot, '
                          f'but the automation failed: {e}. Nothing changed on ESPN -- '
                          'come make this manually if it matters, or check whether the '
                          'ESPN session needs refreshing.'
                      ),
                      meta={"execution_failed": True, "attempted_ir_move": d["ir_move"]},
                  )

          if d["action"] == "add_drop" and ir_ok:
              drop_target = None if d.get("ir_move") else d.get("drop")
              try:
                  browser_actions.submit_waiver_claim(d["add"], drop_target)
              except Exception as e:
                  had_failure = True
                  detail = f', dropping {drop_target}' if drop_target else ''
                  log_store.append_entry(
                      kind="waiver",
                      headline="MOVE COULD NOT BE MADE",
                      reasoning=(
                          f'Tried to add {d["add"]}{detail}, but the automation failed: '
                          f'{e}. Nothing changed on ESPN -- come make this manually if '
                          'it matters, or check whether the ESPN session needs '
                          'refreshing.'
                      ),
                      meta={
                          "execution_failed": True,
                          "attempted_add": d["add"],
                          "attempted_drop": drop_target,
                      },
                  )

          if had_failure:
              sys.exit(1)
          PYEOF

      # if: always() so a failed execution above still gets its "MOVE COULD
      # NOT BE MADE" entry published to the public dashboard, not just left
      # sitting invisibly in a red Actions run nobody but Claude checks.
      - name: Commit updated log
        if: always()
        run: |
          git config user.name "code-red-zone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/log.json
          git commit -m "Weekly waiver decision" || echo "Nothing to commit"
          git push
